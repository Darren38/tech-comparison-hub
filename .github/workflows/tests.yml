# Version 38: the browser tests run on GitHub's machines, in parallel, before a release goes live.
#
# A release is first pushed to the "test" branch (never the live one). This workflow builds the site there with today's
# live data, serves it on the runner and runs each test in its own job with headless Chrome. tests/judge.py reads each
# result: a script error, a layout problem, a broken link or a file of the site failing is a real failure and turns the
# run red; another site's picture or feed being down is listed as a warning. Only after a green run is the release pushed
# to main, which publishes it (.github/workflows/pages.yml). Nothing here can change the live site.
#
# The link check opens only the device pages the release changes (tests/changed_devices.py); run the workflow by hand
# with "full" ticked for the weekly check of every device page.

name: Test a release before it goes live

on:
  push:
    branches: [test]
  workflow_dispatch:
    inputs:
      full:
        description: Check the links of every device page (the weekly full link check)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changed:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      devices: ${{ steps.c.outputs.devices }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Device pages this release changes
        id: c
        run: echo "devices=$(python tests/changed_devices.py origin/main)" >> "$GITHUB_OUTPUT"

  browser:
    needs: changed
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: interactions, script: interact.mjs, args: "" }
          - { name: chart labels, script: charts-auto.mjs, args: "" }
          - { name: personas 1, script: persona.mjs, args: "" }
          - { name: personas 2, script: persona2.mjs, args: "" }
          - { name: personas 3, script: persona3.mjs, args: "" }
          - { name: pages at desktop width, script: sweep.mjs, args: "1366 en detailed tests/routes.txt" }
          - { name: pages at phone width, script: sweep.mjs, args: "390 en detailed tests/routes.txt" }
          - { name: links, script: linkcheck.mjs, args: "" }
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Build the site with today's live data
        run: |
          python tools/seed_live.py
          python tools/build.py
          python tools/seo.py
          python tools/preload.py

      # 127.0.0.2, not 127.0.0.1: the site treats 127.0.0.1 and localhost as the owner's own computer (serve.py) and
      # behaves there in ways GitHub Pages doesn't
      - name: Run the test in headless Chrome
        env:
          FULL: ${{ inputs.full }}
          CHANGED: ${{ needs.changed.outputs.devices }}
        run: |
          if [ "$FULL" != "true" ] && [ -n "$CHANGED" ]; then export LINKCHECK_DEVICES="$CHANGED"; fi
          python -m http.server 8080 --bind 127.0.0.2 > /tmp/server.log 2>&1 &
          google-chrome --headless=new --no-sandbox --disable-gpu --no-first-run --remote-debugging-port=9222 \
            --user-data-dir=/tmp/chrome-profile about:blank > /tmp/chrome.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9222/json/version > /dev/null && curl -sf http://127.0.0.2:8080/ > /dev/null && break
            sleep 1
          done
          timeout 45m node "tests/${{ matrix.script }}" 9222 http://127.0.0.2:8080/ ${{ matrix.args }} | tee result.txt
          python tests/judge.py result.txt
