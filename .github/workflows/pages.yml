# Builds the site and publishes it to GitHub Pages.
#
# Runs on every push to main, every 3 hours, once a day at 00:05 UTC (08:05 Malaysia time), and on demand
# (Actions tab > "Build and deploy" > Run workflow). Each run refreshes the live parts before building:
#   - Bank Negara Malaysia exchange rates   (tools/update_rates.py; keeps the saved rates if unreachable)
#   - latest headlines and YouTube view counts from registered feeds (tools/fetch_headlines.py), added to the year-long
#     archive carried over from the live site (tools/seed_live.py), each headline matched to devices, chips and a topic
#   - at most every 6 hours: Apple's iOS release table and developer releases, Samsung's security bulletin,
#     Apple Malaysia's service programmes and Samsung Malaysia's service pages (tools/fetch_official.py)
#   - one readable page per device and chip plus sitemap.xml for search engines (tools/seo.py)
# and once a day (the first run after 00:00 UTC, kept in a cache for that day's later runs):
#   - benchmark databases: UL 3DMark, AnTuTu, DXOMARK (tools/refresh_benchmarks.py; only phones already matched,
#     large jumps held for a person to check, a source that can't be read keeps its saved values)
#   - phones nobody has matched by hand join the 3DMark, DXOMARK and AnTuTu charts when their exact name and chip match
#     a listing, and Geekbench averages from NanoReview are read about once a week (tools/auto_benchmarks.py)
#   - every device picture still loads (tools/check_images.py; a broken one shows the outline drawing instead)
#   - new phones and tablets: a spec page that newly appears on a maker's Malaysian site is read and, when it passes the
#     checks, the model is added and labelled "Added automatically"; about once a week the makers' spec pages cited by
#     devices already in the hub are re-read to fill missing values (changed values are only listed) (tools/auto_devices.py);
#     Apple from Apple Support's tech-specs pages, Samsung from Samsung Newsroom Malaysia's launch announcements
#   - Trusted Reviews' test results (Geekbench, video battery drain, charging times) from each new review (tools/auto_reviews.py)
#   - older headlines for the device pages, so a phone launched months ago still shows its reviews, tests, videos and
#     news: publishers' sitemaps (only where robots.txt allows, pages read slowly) and, once a week, the registered
#     YouTube channels' upload history (tools/backfill_news.py; Version 21)
# and whenever headlines are waiting for it (Version 21):
#   - an open-source AI model (Qwen3.5 2B, run by llama.cpp on this server's own CPU, both pinned by checksum) checks
#     headlines that name several models and says what new model names in the news are (launched, announced, teased,
#     rumoured); it can only take a device off a headline when the maker it names is in the headline (tools/ai_news_check.py)
# and every 3 days:
#   - official pictures for devices without one, from the maker's own page (tools/find_images.py)
#   - where the product sits in each new picture, so pages can show it cropped and large (tools/image_boxes.py)
# The daily run also keeps the schedule switched on (GitHub would otherwise pause it after 60 days without a push).
# The research data in data/ only changes when it is edited and pushed. If data/ fails validation,
# the build stops and the previous deployment stays online.
name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *" # every 3 hours (UTC), at minute 17 to avoid the busy top of the hour
    - cron: "5 0 * * *"    # daily data refresh at 08:05 Malaysia time
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Security (Version 18): every action is pinned to an exact commit, and the checkout keeps no GitHub token
      # (this job never pushes), so the build steps and the feeds they read can't use the repository's credentials.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Refresh exchange rates (Bank Negara Malaysia)
        run: python tools/update_rates.py

      - name: Carry over the headline archive from the live site
        run: python tools/seed_live.py
        continue-on-error: true

      - name: Collect latest headlines
        run: python tools/fetch_headlines.py
        env:
          # YouTube videos are read through the official YouTube Data API. Without this repository secret the
          # videos collected earlier are kept and no YouTube address is fetched.
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Read Apple's and Samsung's own update and service-programme pages (about every 6 hours)
        run: python tools/fetch_official.py --max-age-hours 5
        continue-on-error: true

      - name: Day stamp for the daily refresh
        id: day
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Reuse today's benchmark and picture check
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: live/auto
          key: daily-refresh-${{ steps.day.outputs.day }}
          restore-keys: daily-refresh-

      # The cache is saved by the first run of each day only; the live site always has the newest automatic results, so
      # after restoring it the newer of the two copies of each file is kept (Version 20).
      - name: Keep the newest automatic results
        run: python tools/seed_live.py --auto-only
        continue-on-error: true

      - name: Add new phones and tablets from makers' own spec pages (daily); re-read spec pages (weekly)
        run: python tools/auto_devices.py
        continue-on-error: true

      - name: Add Trusted Reviews' test results from new reviews (daily; every review once a month)
        run: python tools/auto_reviews.py
        continue-on-error: true

      - name: Refresh benchmark databases (once a day)
        run: python tools/refresh_benchmarks.py --max-age-hours 20
        continue-on-error: true

      - name: Add results for phones not matched by hand yet (3DMark, DXOMARK, AnTuTu daily; Geekbench weekly)
        run: python tools/auto_benchmarks.py
        continue-on-error: true

      - name: Check device pictures (once a day)
        run: python tools/check_images.py --max-age-hours 20
        continue-on-error: true

      - name: Find official pictures for devices without one (every 3 days)
        run: python tools/find_images.py --max-age-hours 69
        continue-on-error: true

      - name: Measure where the product sits in new pictures (every 3 days, after the search)
        run: |
          pip install --quiet pillow
          python tools/image_boxes.py --max-age-hours 69
        continue-on-error: true

      - name: Read older headlines for the device pages (once a day; YouTube upload history once a week)
        run: python tools/backfill_news.py --max-age-hours 20
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        continue-on-error: true

      - name: Headlines and model names waiting for the AI check
        id: aiwait
        run: echo "count=$(python tools/ai_news_check.py --pending | python -c 'import json,sys; d=json.load(sys.stdin); print(d["headlines"] + d["spotted"])')" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      # The model (1.3 GB) and llama.cpp are downloaded once and kept in the Actions cache; both are checked against
      # the checksums published by Hugging Face and GitHub before anything runs.
      - name: Open-source AI model files (kept between runs)
        if: steps.aiwait.outputs.count != '' && steps.aiwait.outputs.count != '0'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/llm
          key: llm-qwen35-2b-q4km-llamacpp-b11208

      - name: AI check of headlines that name several models, and of new model names (Qwen3.5 2B on this server's CPU)
        if: steps.aiwait.outputs.count != '' && steps.aiwait.outputs.count != '0'
        run: |
          mkdir -p ~/llm && cd ~/llm
          [ -f Qwen3.5-2B-Q4_K_M.gguf ] || curl -sSfL --retry 3 -o Qwen3.5-2B-Q4_K_M.gguf             "https://huggingface.co/unsloth/Qwen3.5-2B-GGUF/resolve/f6d5376be1edb4d416d56da11e5397a961aca8ae/Qwen3.5-2B-Q4_K_M.gguf"
          [ -f llama.tar.gz ] || curl -sSfL --retry 3 -o llama.tar.gz             "https://github.com/ggml-org/llama.cpp/releases/download/b11208/llama-b11208-bin-ubuntu-x64.tar.gz"
          echo "aaf42c8b7c3cab2bf3d69c355048d4a0ee9973d48f16c731c0520ee914699223  Qwen3.5-2B-Q4_K_M.gguf" | sha256sum -c -
          echo "090a86baaf81e114031c5111ccc2287696dbd85ae448b9529fd3b398209f7770  llama.tar.gz" | sha256sum -c -
          rm -rf bin && mkdir bin && tar -xzf llama.tar.gz -C bin
          SERVER=$(find bin -name llama-server -type f | head -1)
          export LD_LIBRARY_PATH="$(dirname "$SERVER"):${LD_LIBRARY_PATH:-}"
          "$SERVER" -m Qwen3.5-2B-Q4_K_M.gguf --host 127.0.0.1 --port 8765 -c 4096 -t 4 --jinja > llama.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:8765/health > /dev/null && break; sleep 2; done
          cd "$GITHUB_WORKSPACE"
          python tools/ai_news_check.py --limit 80 --minutes 10 || true
          kill %1 || true
        continue-on-error: true

      # Always: the AI's saved results are applied again after this run's re-matching (no model needed for that).
      - name: Apply the AI check to the headlines
        run: python tools/ai_news_check.py
        continue-on-error: true

      - name: Validate and build data
        run: python tools/build.py

      - name: Assemble the site
        run: |
          mkdir _site
          cp -r index.html sw.js assets src generated live _site/
          cp google*.html _site/   # Google Search Console ownership file; must stay online to stay verified
          touch _site/.nojekyll

      - name: Search-engine pages and sitemap
        run: python tools/seo.py --out _site

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  # GitHub switches off scheduled workflows in a public repository after 60 days without a push. Once a day this job
  # uses GitHub's own "enable workflow" switch on this workflow, which keeps it on without any commit.
  keepalive:
    if: github.event_name == 'schedule' && github.event.schedule == '5 0 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Keep the scheduled updates switched on
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/pages.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
